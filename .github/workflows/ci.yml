name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and safety tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          xcodebuild \
            -project MaXplorer.xcodeproj \
            -scheme MaXplorer \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            build

      - name: File operation safety tests
        env:
          AGENT_BUILD_ROOT: ${{ runner.temp }}
        run: ./scripts/test-file-operations.sh

      - name: Search performance (10k / 100k real files)
        env:
          AGENT_BUILD_ROOT: ${{ runner.temp }}
        run: ./scripts/test-search-performance.sh

      - name: Drag regressions with desktop services denied
        env:
          AGENT_BUILD_ROOT: ${{ runner.temp }}
        run: ./scripts/test-file-drag.sh

      - name: Thumbnail scheduler with desktop services denied
        env:
          AGENT_BUILD_ROOT: ${{ runner.temp }}
        run: ./scripts/test-file-thumbnails.sh
